<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가족치료 시험 대비 — 180문제</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--border:#e2dfd8;--border2:#ccc9c0;--text:#18170f;--text2:#5c5a52;--text3:#9c9a92;--accent:#3354d4;--abg:#edf0fc;--green:#0a6644;--gbg:#e0f3ec;--gbd:#4db88a;--red:#7a1f1f;--rbg:#fce8e8;--rbd:#e88a8a;--amber:#6b3a06;--ambg:#fdf0db;--ambd:#f0b84a;--r:12px;--rs:7px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem 5rem}
.wrap{max-width:760px;margin:0 auto}
.header{text-align:center;margin-bottom:2rem}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:5px}
.header p{font-size:13px;color:var(--text2)}
.topbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.2rem;margin-bottom:1.4rem}
.tg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.tg label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
select{padding:8px 10px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer}
select:focus{outline:2px solid var(--accent);outline-offset:1px}
.start-btn{padding:10px 22px;border-radius:var(--rs);border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.start-btn:hover{opacity:.85}
.scorebar{display:flex;align-items:center;gap:10px;padding:9px 15px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:1.2rem;font-size:13px;color:var(--text2)}
.sc-num{font-size:17px;font-weight:700;color:var(--text)}
.sc-pct{font-size:12px;color:var(--text3)}
.retry-btn{margin-left:auto;padding:4px 11px;border-radius:var(--rs);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;cursor:pointer}
.retry-btn:hover{background:var(--bg)}
.sec-label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:1.6rem 0 .7rem;padding-left:2px}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.3rem 1.4rem;margin-bottom:.9rem}
.qmeta{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.qn{font-size:12px;font-weight:700;color:var(--text3)}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.b-short{background:#f0e8fc;color:#5a1fa0}
.b-fill{background:#fdf0db;color:#7a4200}
.qtext{font-size:15px;font-weight:600;line-height:1.7;margin-bottom:1rem}
.ans-input{width:100%;padding:9px 12px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;margin-bottom:6px}
.ans-input:focus{outline:2px solid var(--accent);outline-offset:1px}
.sub-btn{margin-top:4px;padding:8px 16px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-weight:700;cursor:pointer}
.sub-btn:hover:not(:disabled){background:var(--abg);border-color:var(--accent);color:var(--accent)}
.sub-btn:disabled{opacity:.45;cursor:not-allowed}
.fb{margin-top:11px;padding:10px 13px;border-radius:var(--rs);font-size:13.5px;line-height:1.7;border:1px solid;display:none}
.fb-ok{background:var(--gbg);color:var(--green);border-color:var(--gbd)}
.fb-bad{background:var(--rbg);color:var(--red);border-color:var(--rbd)}
.fb-mid{background:var(--ambg);color:var(--amber);border-color:var(--ambd)}
.empty{text-align:center;padding:4rem 1rem;color:var(--text3)}
.empty .ico{font-size:38px;margin-bottom:12px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.chip{padding:4px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg);font-size:12px;cursor:pointer;color:var(--text2)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:520px){.topbar{flex-direction:column}.start-btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <h1>📖 가족치료 시험 대비 — 180문제</h1>
  <p>단답형 + 빈칸 채우기 | 챕터별 30문제 | 입력 즉시 채점</p>
</div>
<div class="topbar">
  <div class="tg"><label>챕터 선택</label>
    <select id="sel-ch">
      <option value="all">전체 (6챕터 모두)</option>
      <option value="c8">8장 — 정신분석적 가족치료</option>
      <option value="c91">9-1장 — CBT 이론/기법</option>
      <option value="c92">9-2장 — CBT 평가/개입</option>
      <option value="c111">11-1장 — 해결중심치료</option>
      <option value="c121">12-1장 — 이야기치료 이론</option>
      <option value="c122">12-2장 — 이야기치료 실제</option>
    </select>
  </div>
  <div class="tg"><label>문제 수</label>
    <select id="sel-n">
      <option value="30">챕터당 30문제 (전체=180)</option>
      <option value="15">챕터당 15문제 랜덤</option>
    </select>
  </div>
  <button class="start-btn" onclick="startQuiz()">🎲 시작하기</button>
</div>
<div id="score-area" style="display:none">
  <div class="scorebar">
    <span>점수</span>
    <span class="sc-num" id="sc-num">0 / 0</span>
    <span class="sc-pct" id="sc-pct"></span>
    <button class="retry-btn" onclick="startQuiz()">↺ 다시 풀기</button>
  </div>
</div>
<div id="quiz-area"><div class="empty"><div class="ico">🎓</div><p>챕터와 문제 수를 선택하고<br><strong>시작하기</strong>를 눌러줘!</p></div></div>
</div>

<script>
// ─────────────────────────────────────────
// 데이터: SHORT(단답형), FILL(빈칸 채우기)
// 챕터 코드: c8 / c91 / c92 / c111 / c121 / c122
// ─────────────────────────────────────────

var SHORT = [

// ══════════════════════════════════════════
// 8장 정신분석적 가족치료 (15개)
// ══════════════════════════════════════════
{ch:"c8",q:"내담자가 치료자에게 과거 중요한 관계에서 형성된 감정·기대·관계 패턴을 무의식적으로 옮겨오는 현상을 무엇이라 하는가?",kw:["전이","transference"],ans:"전이(transference)",ex:"치료자에게 부모처럼 느끼거나 의존하는 것이 대표적 예다."},
{ch:"c8",q:"치료자가 내담자에게 자신의 무의식적 감정이나 반응을 느끼고 반응하는 것을 무엇이라 하는가?",kw:["역전이","countertransference"],ans:"역전이(countertransference)",ex:"전이와 방향이 반대(치료자→내담자)임을 기억하라."},
{ch:"c8",q:"자신이 인정하기 어려운 감정·욕구를 타인에게 돌려 지각하는 무의식적 방어기제의 명칭은?",kw:["투사","projection"],ans:"투사(projection)",ex:"'저 사람이 나를 싫어해' — 실제로는 내가 그 사람을 싫어하는 경우가 투사의 예다."},
{ch:"c8",q:"투사에서 한 단계 더 나아가, 상대방이 투사된 내용에 맞게 실제로 행동하게 되어 자기충족적 순환이 형성되는 관계적 과정을 무엇이라 하는가?",kw:["투사적 동일시","projective identification"],ans:"투사적 동일시(projective identification)",ex:"단순 투사는 귀인만, 투사적 동일시는 상대가 실제로 그 역할을 수행하게 된다."},
{ch:"c8",q:"타인을 전적으로 좋거나 전적으로 나쁜 존재로 이분법적으로 바라보는 방어기제를 무엇이라 하는가?",kw:["분열","splitting"],ans:"분열(splitting)",ex:"불안정 애착 개인에서 두드러지며, 가족 내 양극화를 초래한다."},
{ch:"c8",q:"타인(특히 양육자)의 특성이나 태도를 무의식적으로 흡수하여 자신의 자아 개념의 일부로 내면화하는 과정은?",kw:["내사","introjection"],ans:"내사(introjection)",ex:"내사는 타인→자아 방향, 투사는 자아→타인 방향이다."},
{ch:"c8",q:"Winnicott이 제시한 개념으로, 아이의 내적 경험을 인정하고 공감해주는 양육 행위를 무엇이라 하는가?",kw:["반영","mirroring"],ans:"반영(mirroring)",ex:"'네가 어떻게 느끼는지 알아' — 아이의 안정적 자아 형성의 핵심 요소."},
{ch:"c8",q:"타인의 인정을 얻기 위해 진짜 감정과 욕구를 숨기며 형성된 자아를 Winnicott은 무엇이라 불렀는가?",kw:["거짓자기","false self"],ans:"거짓자기(false self)",ex:"의존 욕구가 미충족되거나 감정이 인정받지 못할 때 형성된다."},
{ch:"c8",q:"Mahler가 제시한 개념으로, 애착을 잃지 않으면서 자율성을 키워가는 건강한 발달 과정을 무엇이라 하는가?",kw:["분리-개별화","separation-individuation","개별화"],ans:"분리-개별화(separation-individuation)",ex:"건강한 발달 = 애착 유지 + 자율성 발달."},
{ch:"c8",q:"정신분석적 가족치료에서 치료자의 역할을 한 단어로 표현하면? (치료자가 무의식을 해석하고 통찰을 돕는 역할)",kw:["해석자","해석"],ans:"해석자(interpreter)",ex:"체계 접근: 중재자·촉진자. 정신분석 접근: 해석자."},
{ch:"c8",q:"대상관계이론에서 '대상(object)'이란 실제 외부 인물이 아니라 경험과 기대를 통해 형성된 자기·타인에 대한 무엇인가?",kw:["심리적 이미지","내면화된 표상","표상"],ans:"심리적 이미지(내면화된 표상)",ex:"대상관계 = 내면화된 표상과 관계하는 방식이 현재 관계에 영향을 미친다."},
{ch:"c8",q:"이상적인 가족발달에서 '충분히 좋은 어머니(good-enough mothering)'가 촉진하는 발달 과정은?",kw:["분리-개별화","separation-individuation","개별화"],ans:"분리-개별화",ex:"완벽한 어머니가 아니라 '충분히 좋은' 어머니 = 안전한 탐색 환경 제공."},
{ch:"c8",q:"정신분석적 가족치료의 네 가지 기본 기법을 모두 쓰시오.",kw:["경청","공감","해석","분석적 중립성"],ans:"경청(listening), 공감(empathy), 해석(interpretation), 분석적 중립성(analytic neutrality)",ex:"이 네 가지는 통찰을 촉진하고 working through 과정을 돕는다."},
{ch:"c8",q:"안정적이고 통합된 자아 형성을 위해 필요한 양육의 두 가지 핵심 요소는 반영(mirroring)과 무엇인가?",kw:["이상화","이상화 모델","models of idealization"],ans:"이상화 모델(models of idealization)",ex:"'우리 엄마는 정말 훌륭해, 나는 그런 엄마의 일부야' — 안정적 자존감의 기반."},
{ch:"c8",q:"Henry Dicks는 대상관계이론을 어떤 임상 영역에 처음 적용하였는가?",kw:["부부","부부갈등","부부치료"],ans:"부부 갈등 치료(부부치료)",ex:"부부 문제 = 현재 사건 + 오래된 감정 시나리오의 재연 (Dicks, 1960s)"},

// ══════════════════════════════════════════
// 9-1장 CBT 이론/기법 (15개)
// ══════════════════════════════════════════
{ch:"c91",q:"Ellis의 ABC 모형에서 A, B, C가 각각 의미하는 것을 쓰시오.",kw:["선행사건","신념","결과"],ans:"A = 선행사건(Activating Event), B = 신념(Beliefs), C = 결과(Consequences)",ex:"핵심: B(신념)가 C(결과)를 결정한다. A 자체가 아님."},
{ch:"c91",q:"쾌 자극을 제시하여 행동을 증가·유지시키는 강화를 무엇이라 하는가?",kw:["정적 강화","positive reinforcement"],ans:"정적 강화(positive reinforcement)",ex:"칭찬·상을 주어 행동을 늘리는 것."},
{ch:"c91",q:"혐오 자극을 제거하여 행동을 증가·유지시키는 것은?",kw:["부적 강화","negative reinforcement"],ans:"부적 강화(negative reinforcement)",ex:"숙제를 하면 잔소리가 멈춤 → 부적 강화."},
{ch:"c91",q:"쾌 자극을 제거하여 행동을 감소시키는 처벌의 유형을 무엇이라 하는가?",kw:["부적 처벌","반응대가"],ans:"부적 처벌(반응대가, response cost)",ex:"규칙 어기면 게임 시간 빼앗음 → 부적 처벌."},
{ch:"c91",q:"Wolpe가 고전적 조건형성과 상호억제 원리에 기반하여 개발한 불안 치료 기법의 명칭은?",kw:["체계적 둔감법","systematic desensitization"],ans:"체계적 둔감법(Systematic Desensitization)",ex:"이완 상태에서 단계적 불안 자극 노출 → 불안 반응 약화."},
{ch:"c91",q:"역기능적 도식(dysfunctional schema)이란 무엇인가?",kw:["왜곡","경직","신념체계","원가족"],ans:"자기·타인·관계에 대해 왜곡되고 경직된 신념 체계; 원가족 경험에서 비롯되는 경우가 많다.",ex:"예: '나는 사랑받을 수 없어', '강해야만 인정받는다'."},
{ch:"c91",q:"자동적 사고의 이면에 있는 핵심신념(schema)까지 탐색하기 위해 '만약 그게 사실이라면 무엇을 의미하나?'를 반복하는 기법은?",kw:["하향 화살표","downward arrow"],ans:"하향 화살표 기법(downward arrow technique)",ex:"자동적 사고 → 중간신념 → 핵심신념 단계적 탐색."},
{ch:"c91",q:"Beck의 인지적 매개 모형에서 정서와 행동을 매개하는 세 가지 인지 요소를 쓰시오.",kw:["신념","귀인","기대"],ans:"신념(beliefs), 귀인(attributions), 기대(expectations)",ex:"인지가 정서·행동을 매개 → 인지 수정이 치료의 핵심."},
{ch:"c91",q:"인지행동가족치료에서 사회교환이론(Social Exchange Theory)의 핵심 전제를 한 문장으로 쓰시오.",kw:["보상","최대화","비용","최소화"],ans:"사람들은 관계 속에서 보상은 최대화하고 비용은 최소화하려 한다.",ex:"관계 만족 = 높은 보상 교환 빈도 + 낮은 비용."},
{ch:"c91",q:"고확률 행동을 저확률 행동의 강화물로 사용하는 원리를 무엇이라 하는가?",kw:["프리맥","premack"],ans:"프리맥 원리(Premack Principle)",ex:"좋아하는 TV 시청(고확률)으로 숙제(저확률)를 강화."},
{ch:"c91",q:"인지행동가족치료에서 인지적 왜곡 8가지 유형 중 '증거 없이 부정적 결론을 내리는 것'은?",kw:["임의적 추론","arbitrary inference"],ans:"임의적 추론(Arbitrary inference)",ex:"'그 사람이 날 무시하는 게 분명해' — 아무 증거 없이 결론 내림."},
{ch:"c91",q:"인지적 왜곡 중 '하나의 실패 경험으로 모든 상황에 실패할 것이라 일반화하는 것'은?",kw:["과잉 일반화","overgeneralization"],ans:"과잉 일반화(Overgeneralization)",ex:"'나는 항상 실패야' — 한두 번 경험으로 광범위 결론."},
{ch:"c91",q:"인지적 왜곡 중 '타인의 생각을 마음대로 추론하는 것'을 무엇이라 하는가?",kw:["독심술","마음 읽기","mind reading"],ans:"독심술/마음 읽기(Mind reading)",ex:"'저 사람은 내가 싫은 거야' — 확인 없이 타인의 마음을 단정."},
{ch:"c91",q:"목표 행동을 작은 단계로 나누어 점진적으로 강화해가는 행동주의 기법은?",kw:["조형","shaping"],ans:"조형(Shaping)",ex:"복잡한 행동을 작은 근사치부터 단계적으로 강화."},
{ch:"c91",q:"아동의 행동 변화에 따라 부모가 보상을 제공하기로 약속하는 계약 형식의 기법은?",kw:["유관계약","contingency contracting"],ans:"유관계약(Contingency Contracting)",ex:"'5일 동안 숙제를 완료하면 토요일에 동물원' — 행동-보상 명시."},

// ══════════════════════════════════════════
// 9-2장 CBT 평가/개입 (15개)
// ══════════════════════════════════════════
{ch:"c92",q:"자동적 사고를 알아차리고 인지적 오류를 기록·수정하기 위한 구조화된 도구는?",kw:["자동적 사고 기록지","사고 기록지"],ans:"자동적 사고 기록지(thought record)",ex:"상황 → 자동적 사고 → 감정 → 왜곡 → 대안적 사고 → 결과 순서로 기록."},
{ch:"c92",q:"소크라테스식 질문의 핵심 목적을 한 문장으로 쓰시오.",kw:["스스로","검토","가설","인지 재구조화","새로운 관점"],ans:"내담자 스스로 자신의 사고를 검토하고 새로운 관점을 발견하여 인지 재구조화를 이루도록 돕는 것.",ex:"치료자가 답을 주는 것이 아니라 질문으로 인도."},
{ch:"c92",q:"도식(schema)을 수정하는 4단계 작업을 순서대로 쓰시오.",kw:["가설","증거","이득과 손실","인지 재구조화","연습"],ans:"①도식을 가설로 검토·증거 점검 → ②이득과 손실 검토 → ③인지 재구조화(새 신념 구성) → ④새 도식을 행동·경험으로 연습(체험화)",ex:"가설 검토 → 이득·손실 → 재구조화 → 체험화 연습."},
{ch:"c92",q:"공감적 의사소통 훈련에서 화자가 지켜야 할 핵심 규칙 3가지를 쓰시오.",kw:["주관성","비난","나 전달","구체적","짧게"],ans:"①주관성 강조('내가 느끼기에는…'), ②상대를 비난하지 않고 자신의 감정·생각만 말하기, ③짧고 구체적으로 말하기",ex:"나 전달법(I-message) + 비난 금지 + 짧고 구체적."},
{ch:"c92",q:"청자(listener)의 공감적 경청 기술 중 이해 확인 방법을 구체적으로 쓰시오.",kw:["요약","피드백","이해"],ans:"상대의 이야기를 요약해서 '~해서 ~하게 느꼈다는 걸로 들려, 내가 이해한 게 맞아?'처럼 이해한 바를 확인한다.",ex:"요약 + 피드백 요청 — 상대가 이해받았다고 느끼게 한다."},
{ch:"c92",q:"인지행동가족치료의 문제해결 대화 5단계를 순서대로 쓰시오.",kw:["문제 정의","이슈","욕구","해결책","결정","시험"],ans:"①문제 정의하기 → ②이슈의 중요성과 자신의 욕구 명확하게 하기 → ③가능한 해결책들 제안하고 논의하기 → ④해결책 결정 → ⑤시험 기간 설정 및 수정",ex:"Epstein & Baucom(2002) / Epstein & Falconier(2024) 모델."},
{ch:"c92",q:"행동 교환(behavior exchange) 기법에서 각 배우자가 먼저 수행하는 과제는?",kw:["목록","세 가지","원하는 행동"],ans:"상대방이 보다 자주 행동하기 원하는 행동 세 가지를 목록으로 작성한다.",ex:"행동 교환: 감정 변화 이전에 행동부터 → 긍정 정서 유발."},
{ch:"c92",q:"두 배우자가 각자 원하는 특정 행동을 서로 약속하는 상호적 계약의 명칭은?",kw:["상호교환 계약","quid pro quo"],ans:"상호교환 계약(quid pro quo contract)",ex:"공정성·상호성 강화. 한쪽만의 약속이 아니라 쌍방 계약."},
{ch:"c92",q:"행동치료에서 '증상은 조작적 조건형성에 의해 학습된 반응이다'는 관점이 치료에서 의미하는 바는?",kw:["증상","강화","환경","유지","학습"],ans:"증상 자체와 그것을 강화·유지시키는 환경(가족 구성원의 반응)에 초점을 두어 강화 조건을 수정하면 증상이 감소할 수 있다.",ex:"증상 = 깊은 상징적 의미 X, 강화된 학습된 반응 O."},
{ch:"c92",q:"인지행동가족치료의 '행동 안내(guided behavior change)'에서 치료자가 취하는 태도는?",kw:["문답","부드러운 제안","내담자","고안","실행"],ans:"문답이나 부드러운 제안을 통해 내담자가 스스로 행동 변화를 고안하고 실행하도록 돕는다.",ex:"직접 지시가 아니라 내담자의 자율적 결정 촉진."},
{ch:"c92",q:"인지행동가족치료에서 '가족 스트레스와 대처'를 다룰 때, 가족 전체가 스트레스 상황일 때 권장하는 대처 방식은?",kw:["공동","대처"],ans:"공동 대처(집합적 대처) — 가족이 함께 스트레스원에 대응하기",ex:"개인 대처 + 공동 대처 병행. 비효과적 공동대처 방식도 함께 점검."},
{ch:"c92",q:"자동적 사고 기록지의 6개 컬럼을 순서대로 쓰시오.",kw:["상황","자동적 사고","감정","왜곡","대안적 사고","결과"],ans:"상황 → 자동적 사고(확신 수준) → 감정(강도%) → 왜곡 유형 → 대안적 사고/반응 → 결과(확신 재평가)",ex:"구조화된 인지 재구조화 훈련 도구."},
{ch:"c92",q:"인지행동치료에서 행동변화와 인지변화의 관계는?",kw:["인지","태도","신념","변화","행동"],ans:"인지주의 관점에서는 사고·신념·태도의 변화가 먼저 이루어져야 행동 변화를 촉진하고 유지할 수 있다.",ex:"인지 변화 → 행동 변화. 반대로 행동 교환처럼 행동 변화 → 인지 변화도 가능."},
{ch:"c92",q:"행동주의 부부치료에서 '갈등 다루기(conflict engagement)'의 목표는?",kw:["갈등","회피","건설적"],ans:"갈등을 회피하지 않고 건설적으로 다루도록 돕는 것",ex:"갈등 자체를 없애는 것이 아니라 다루는 방식을 변화시키는 것."},
{ch:"c92",q:"인지행동가족치료에서 '건강하지 않은 가족'의 정의는?",kw:["선호하는 미래","비효과적","패턴","갇힌"],ans:"선호하는 미래 없이 비효과적인 패턴에 갇혀 있는 상태",ex:"건강한 가족: 스스로 정한 목표를 향해 나아가는 가족."},

// ══════════════════════════════════════════
// 11-1장 해결중심치료 (15개)
// ══════════════════════════════════════════
{ch:"c111",q:"해결중심치료를 창시한 두 인물과 그들이 설립한 센터 명칭을 쓰시오.",kw:["steve de shazer","insoo kim berg","bftc","밀워키"],ans:"Steve de Shazer, Insoo Kim Berg — 밀워키 단기가족치료센터(BFTC) 설립",ex:"BFTC = Brief Family Therapy Center."},
{ch:"c111",q:"해결중심치료에서 '문제가 덜 심각하거나 나타나지 않았던 때'를 무엇이라 부르며, 치료에서 어떻게 활용하는가?",kw:["예외","exception"],ans:"예외(exception) — 예외 상황에서 무엇이 달랐는지를 탐색하여 변화의 구성 요소로 활용한다.",ex:"예외 = 내담자의 강점과 해결책이 이미 존재하는 증거."},
{ch:"c111",q:"'하룻밤 사이에 기적이 일어났다면 어떤 모습일까요?'라는 해결중심치료의 대표 기법을 무엇이라 하는가?",kw:["기적 질문","miracle question"],ans:"기적 질문(Miracle Question)",ex:"문제 없는 미래를 구체적으로 그리게 하여 치료 목표와 방향을 설정."},
{ch:"c111",q:"1~10 척도를 활용하여 내담자의 주관적 경험을 수치화하고 변화 추이를 파악하는 기법은?",kw:["척도 질문","scaling question"],ans:"척도 질문(Scaling Questions)",ex:"동기·희망·자신감·증상 강도 등 다양하게 활용 가능."},
{ch:"c111",q:"해결중심치료의 첫 상담 공식과제는 무엇인가?",kw:["계속되길 원하는","관찰","긍정"],ans:"'당신이 계속되길 원하는 것 중 어떤 일이 일어나는지 관찰해보세요'",ex:"주의를 문제에서 예외·자원으로 전환. 변화는 이미 시작되었다는 암시."},
{ch:"c111",q:"해결중심치료에서 치료자의 역할을 비전문가적 태도와 관련하여 설명하시오.",kw:["내담자","전문가","호기심","비전문가적","협력"],ans:"내담자를 자신의 삶에 가장 잘 아는 전문가로 보며, 치료자는 호기심 어린 비전문가적 태도로 내담자와 협력한다.",ex:"The Client as Expert — 치료자는 변화를 지시하는 사람이 아니라 협력 동반자."},
{ch:"c111",q:"해결중심치료에서 '건강하지 않은 가족'을 어떻게 정의하는가?",kw:["선호하는 미래","비효과적","패턴","갇힌"],ans:"선호하는 미래 없이 비효과적인 패턴에 갇혀 있는 상태",ex:"반대로 건강한 가족: 스스로 정한 목표를 향해 나아가는 가족."},
{ch:"c111",q:"해결중심치료에서 목표 설정의 4가지 요건을 쓰시오.",kw:["구체적","관찰 가능","미래 지향","현실적","내담자"],ans:"①구체적, ②관찰 가능, ③미래 지향적, ④현실적이고 내담자가 통제 가능한 것",ex:"문제의 부재가 아니라 바람직한 행동이 어떤 것인지로 목표를 묘사."},
{ch:"c111",q:"해결중심치료의 Core Assumptions 5가지를 쓰시오.",kw:["유능한","작은 변화","현재와 미래","언어","예외"],ans:"①내담자는 유능한 존재, ②작은 변화가 큰 변화 촉발, ③과거 아닌 현재·미래 초점, ④내담자 언어가 인식에 영향, ⑤문제는 항상 존재하지 않으며 예외가 중요",ex:"해결중심치료의 기본 전제 5가지."},
{ch:"c111",q:"해결중심치료에서 '뭔가 평소와 다르게 해 보기(Do something different)' 과제의 목적은?",kw:["악순환","깨뜨리기","반응","통제","창의적"],ans:"내담자가 문제의 악순환에 빠져 있을 때 이를 깨뜨리기 위해 나의 반응을 바꾸어 상황을 주도하고 창의적 해결책을 찾게 한다.",ex:"내가 통제할 수 없는 것(타인, 상황)이 아니라 내 반응(나)에 초점."},
{ch:"c111",q:"해결중심치료에서 '종결 시점'은 누가 결정하는가? 그 이유는?",kw:["내담자","결정","목표"],ans:"내담자가 결정한다. 내담자가 정한 목표가 충분히 달성되었다고 판단하는 시점에 종결한다.",ex:"치료자가 종결을 결정하지 않음 — 내담자 자율성 존중."},
{ch:"c111",q:"해결중심치료가 '해결이 강요된 치료(solution-forced therapy)'라는 비판에 대해 어떻게 응답하는가?",kw:["공감","경청","내담자","현실","이해","문화"],ans:"치료사의 공감 어린 경청과 내담자 현실에 대한 깊은 이해, 그리고 문화적 감수성이 필수적이며 치료 철학의 내면화가 전제되어야 한다.",ex:"비판 인정 + 공감적 경청과 문화 감수성으로 보완."},
{ch:"c111",q:"해결중심치료에서 후반 회기마다 묻는 핵심 질문은?",kw:["무엇이 더 나아졌는지","나아졌나요"],ans:"'지난번 이후 무엇이 더 나아졌는지' 묻는다.",ex:"변화에 무엇이 기여했는지도 함께 탐색."},
{ch:"c111",q:"해결중심치료에서 칭찬과 강화(Compliments and Reinforcement)가 내담자에게 미치는 효과 2가지를 쓰시오.",kw:["동기","자기 효능감"],ans:"①내담자의 동기 향상, ②자기 효능감 증대",ex:"결과만이 아니라 노력 자체를 인정하는 것이 핵심."},
{ch:"c111",q:"해결중심치료가 전통적인 가족치료 모델과 가장 크게 다른 점은 무엇인가?",kw:["문제","해결","진단","강점"],ans:"문제 진단·원인 탐색보다 해결 구축에 초점을 두며, 역기능적 패턴에 이름 붙이거나 진단하는 것을 피하고 내담자의 강점과 자원을 활용한다.",ex:"문제 중심 → 해결 중심으로 치료 초점 전환."},

// ══════════════════════════════════════════
// 12-1장 이야기치료 이론 (15개)
// ══════════════════════════════════════════
{ch:"c121",q:"이야기 치료의 철학적 배경인 두 가지 이론을 쓰시오.",kw:["사회구성주의","포스트모던","postmodern"],ans:"사회구성주의(Social Constructionism)와 포스트모던(Postmodern) 관점",ex:"경험의 의미는 고정된 것이 아니라 해석을 통해 구성된다는 것이 핵심."},
{ch:"c121",q:"이야기 치료를 발전시킨 두 핵심 인물과 각자의 주요 기여를 쓰시오.",kw:["michael white","david epston","외재화","편지","치료적 편지"],ans:"Michael White(외재화, 억압적 담론 해체 작업), David Epston(이야기 은유, 치료적 편지, 지지 공동체 강조)",ex:"White: 호주 Adelaide Dulwich Centre. Epston: 뉴질랜드."},
{ch:"c121",q:"문제를 사람의 정체성과 분리하는 이야기 치료의 핵심 대화 방식은?",kw:["외재화","externalization"],ans:"외재화(Externalization)",ex:"'나는 우울하다' → '나는 우울과 싸우고 있다'."},

// ─────────────────────────────────────────
// 상태 & 로직
// ─────────────────────────────────────────
var CUR={short:[],fill:[]};
var SC={ok:0,total:0};

function sh(a){return [...a].sort(()=>Math.random()-.5);}

function startQuiz(){
  var ch=document.getElementById('sel-ch').value;
  var n=parseInt(document.getElementById('sel-n').value);
  var s=ch==='all'?SHORT:SHORT.filter(q=>q.ch===ch);
  var f=ch==='all'?FILL:FILL.filter(q=>q.ch===ch);
  if(n===15){s=sh(s).slice(0,Math.min(15,s.length));f=sh(f).slice(0,Math.min(15,f.length));}
  CUR={short:s,fill:f};
  SC={ok:0,total:0};
  document.getElementById('score-area').style.display='block';
  upSc();render();
  window.scrollTo(0,0);
}

function upSc(){
  document.getElementById('sc-num').textContent=SC.ok+' / '+SC.total;
  var p=SC.total>0?Math.round(SC.ok/SC.total*100):0;
  document.getElementById('sc-pct').textContent=SC.total>0?'('+p+'%)':'';
}

function render(){
  var a=document.getElementById('quiz-area');a.innerHTML='';
  if(CUR.short.length>0){
    var sl=document.createElement('div');sl.className='sec-label';sl.textContent='단답형 — 핵심 개념·기법 서술';a.appendChild(sl);
    CUR.short.forEach(function(q,i){a.appendChild(mkShort(q,i));});
  }
  if(CUR.fill.length>0){
    var fl=document.createElement('div');fl.className='sec-label';fl.textContent='빈칸 채우기 — 2개 이상 정확히';a.appendChild(fl);
    CUR.fill.forEach(function(q,i){a.appendChild(mkFill(q,i));});
  }
}

function mkShort(q,i){
  var d=document.createElement('div');d.className='qcard';
  d.innerHTML='<div class="qmeta"><span class="qn">Q'+(i+1)+'</span><span class="badge b-short">단답형</span></div>'+
    '<div class="qtext">'+q.q+'</div>'+
    '<input type="text" class="ans-input" id="sh'+i+'inp" placeholder="정답을 입력하세요..." autocomplete="off"/>'+
    '<button class="sub-btn" id="sh'+i+'btn" onclick="sbShort('+i+')">제출하기</button>'+
    '<div class="fb" id="sh'+i+'fb"></div>';
  var inp=d.querySelector('#sh'+i+'inp');
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')sbShort(i);});
  return d;
}

function sbShort(i){
  var q=CUR.short[i];
  var btn=document.getElementById('sh'+i+'btn');if(btn.disabled)return;
  btn.disabled=true;btn.textContent='채점됨';
  var v=(document.getElementById('sh'+i+'inp').value||'').toLowerCase().trim();
  var hit=q.kw.filter(function(kw){return v.includes(kw.toLowerCase());}).length;
  var tot=q.kw.length;
  var ok=(hit/tot)>=0.5;
  SC.total++;if(ok)SC.ok++;else if(hit>0)SC.ok+=0.5;
  upSc();
  var fb=document.getElementById('sh'+i+'fb');fb.style.display='block';
  if(ok){fb.className='fb fb-ok';fb.innerHTML='✅ 정답!<br><strong>모범 답안:</strong> '+q.ans+'<br><small style="opacity:.7">'+q.ex+'</small>';}
  else if(hit>0){fb.className='fb fb-mid';fb.innerHTML='🟡 부분 정답 ('+hit+'/'+tot+' 키워드)<br><strong>모범 답안:</strong> '+q.ans+'<br><small style="opacity:.7">'+q.ex+'</small>';}
  else{fb.className='fb fb-bad';fb.innerHTML='❌ 오답<br><strong>모범 답안:</strong> '+q.ans+'<br><small style="opacity:.7">'+q.ex+'</small>';}
}

function mkFill(q,i){
  var d=document.createElement('div');d.className='qcard';
  var num=CUR.short.length+i+1;
  var inp=q.labels.map(function(lb,bi){
    return '<div style="margin-bottom:8px"><span style="font-size:13px;color:var(--text2);display:block;margin-bottom:3px">'+lb+'</span>'+
      '<input type="text" class="ans-input" id="fi'+i+'i'+bi+'" placeholder="'+lb+' 정답..." autocomplete="off" onkeydown="if(event.key===\'Enter\')sbFill('+i+')"/></div>';
  }).join('');
  d.innerHTML='<div class="qmeta"><span class="qn">Q'+num+'</span><span class="badge b-fill">빈칸 채우기</span></div>'+
    '<div class="qtext">'+q.q+'</div>'+inp+
    '<button class="sub-btn" id="fi'+i+'btn" onclick="sbFill('+i+')">제출하기</button>'+
    '<div class="fb" id="fi'+i+'fb"></div>';
  return d;
}

function sbFill(i){
  var q=CUR.fill[i];var btn=document.getElementById('fi'+i+'btn');if(btn.disabled)return;
  btn.disabled=true;btn.textContent='채점됨';
  var ok=0;
  q.kw.forEach(function(kwArr,bi){
    var v=(document.getElementById('fi'+i+'i'+bi).value||'').toLowerCase().trim();
    if(kwArr.some(function(kw){return v.includes(kw.toLowerCase());}))ok++;
  });
  var tot=q.labels.length;var rc,ic;
  if(ok===tot){rc='fb-ok';ic='✅ 모두 정답! ('+ok+'/'+tot+')';SC.ok++;}
  else if(ok>0){rc='fb-mid';ic='🟡 부분 정답 ('+ok+'/'+tot+')';SC.ok+=0.5;}
  else{rc='fb-bad';ic='❌ 오답 (0/'+tot+')';}
  SC.total++;upSc();
  var fb=document.getElementById('fi'+i+'fb');fb.style.display='block';fb.className='fb '+rc;
  fb.innerHTML=ic+'<br><strong>모범 답안:</strong> '+q.ans.join(' / ')+'<br><small style="opacity:.7">'+q.ex+'</small>';
}
</script>
